async function getSearchResults(request, page) {
  try {
    const searchQuery = encodeURIComponent((request && request.searchString) || "");
    const response = await httpRequest(`https://pimpbunny.com/search?q=${searchQuery}&page=${page}`, { "User-Agent": "Mozilla/5.0" });
    return response.status === 200 ? parseVideosFromHtml(response.body) : [];
