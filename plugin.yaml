}

function getVideoUriFromID(videoID) {
  return `https://pimpbunny.com/videos/${encodeURIComponent(videoID)}`;
}

async function getVideoMetadata(videoId, uvp) {
  try {
    const response = await httpRequest(getVideoUriFromID(videoId), { "User-Agent": "Mozilla/5.0" });
    if (response.status !== 200) throw new Error(`HTTP ${response.status}`);

    const html = response.body;
    const title = cleanText(
      firstMatch(html, [
        /<meta[^>]*property=["']og:title["'][^>]*content=["']([^"']+)["'][^>]*>/i,
        /<h1\b[^>]*>([\s\S]*?)<\/h1>/i,
      ]) || videoId
    );

    const authorMatch = html.match(/\/onlyfans-creators\/([^"'?#/]+)/i);
    const authorID = authorMatch ? authorMatch[1] : "";
    const authorName = cleanText(
      firstMatch(html, [
        /<a\b[^>]*href=["'](?:https?:\/\/pimpbunny\.com)?\/onlyfans-creators\/[^"']+["'][^>]*>([\s\S]*?)<\/a>/i,
      ]) || ""
    );

    const m3u8 = {};
    const m3u8Matches = html.match(/https?:\/\/[^\s"'<>]+\.m3u8[^\s"'<>]*/gi) || [];
    m3u8Matches.forEach((url, index) => {
      m3u8[String(index)] = url;
    });

    const preview = absoluteUrl(
      firstMatch(html, [
        /<video\b[^>]*src=["']([^"']*\/get_file\/[^"']+)["'][^>]*>/i,
        /data-preview=["']([^"']+)["'][^>]*>/i,
      ])
    );

    return {
      iD: videoId,
      m3u8Uris: m3u8,
      playbackHttpHeaders: { Referer: "https://pimpbunny.com/" },
      title,
      universalVideoPreview: uvp || {},
      authorID,
      authorName,
      authorSubscriberCount: 0,
      authorAvatar: null,
      actors: [],
      description: null,
      viewsTotal: 0,
      tags: [],
      categories: [],
      uploadDate: null,
      ratingsPositiveTotal: 0,
      ratingsNegativeTotal: 0,
      ratingsTotal: 0,
      virtualReality: false,
      chapters: {},
      rawHtml: html,
      previewVideo: preview,
    };
  } catch (e) {
    consoleLog("error", `Error fetching video metadata: ${e.message}`);
    return null;
  }
}

async function downloadThumbnail(uri, headers) {
  try {
    const response = await httpRequest(uri, headers || {});
    return response.status === 200 ? (response.bodyBase64 || "") : "";
  } catch (e) {
    consoleLog("error", `Error downloading thumbnail: ${e.message}`);
    return "";
  }
}

