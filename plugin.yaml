  return `https://pimpbunny.com/onlyfans-creators/${encodeURIComponent(authorID)}`;
}

async function getAuthorPage(authorID) {
  try {
    const response = await httpRequest(getAuthorUriFromID(authorID), { "User-Agent": "Mozilla/5.0" });
    if (response.status !== 200) throw new Error(`HTTP ${response.status}`);

    const title = cleanText(
      firstMatch(response.body, [
        /<meta[^>]*property=["']og:title["'][^>]*content=["']([^"']+)["'][^>]*>/i,
        /<h1\b[^>]*>([\s\S]*?)<\/h1>/i,
        /<h2\b[^>]*>([\s\S]*?)<\/h2>/i,
      ]) || authorID
    );

    return {
      iD: authorID,
      name: title,
      avatar: null,
      banner: null,
      aliases: [],
      description: null,
      advancedDescription: {},
      externalLinks: {},
      viewsTotal: 0,
      videosTotal: 0,
      subscribers: 0,
      rank: 0,
      rawHtml: response.body,
    };
  } catch (e) {
    consoleLog("error", `Error fetching author page: ${e.message}`);
    return null;
  }
}

async function getAuthorVideos(authorID, page) {
  try {
    const response = await httpRequest(`${getAuthorUriFromID(authorID)}?page=${page}`, { "User-Agent": "Mozilla/5.0" });
    return response.status === 200 ? parseVideosFromHtml(response.body) : [];
  } catch (e) {
    consoleLog("error", `Error fetching author videos: ${e.message}`);
    return [];
  }
}
